<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — MobiCidade</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="titulo-login">
    <div class="auth-card__brand">
      <span class="logo" aria-hidden="true">🌿</span>
      <h1 id="titulo-login">Entrar na MobiCidade</h1>
      <p>Acesse com seu CPF cadastrado</p>
    </div>

    <div id="msgLogin" class="auth-msg auth-msg--erro" hidden role="alert"></div>

    <form id="formLogin" class="auth-form">
      <div>
        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required autocomplete="username" maxlength="14">
      </div>
      <div>
        <label for="senha">Senha *</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>

    <p class="auth-footer">
      Ainda não tem conta? <a href="/cadastro.html">Cadastre-se com CPF</a>
    </p>

  </main>

  <script src="/js/auth.js"></script>
  <script>
    if (getToken()) {
      validarSessao().then((u) => { if (u) window.location.href = '/'; });
    }

    document.getElementById('cpf').addEventListener('input', (e) => {
      e.target.value = mascararCpf(e.target.value);
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msgLogin');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cpf: document.getElementById('cpf').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.erro || 'Erro ao entrar';
          msg.hidden = false;
          return;
        }
        salvarSessao(data.token, data.cidadao);
        window.location.href = '/';
      } catch {
        msg.textContent = 'Erro de conexão. Tente novamente.';
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
